version: '3'

vars:
  COMPOSE_FILE: docker-compose.yaml
  COMPOSE_EXAMPLE: docker-compose.yaml.example
  STORAGE_DOCKERFILE: services/storage/Dockerfile
  STORAGE_IMAGE_NAME: '{{.STORAGE_IMAGE_NAME | default "bowl-storage"}}'
  TAG: '{{.TAG | default "latest"}}'
  PROTO_DIR: proto
  GEN_DIR: gen
  STORAGE_DB_DSN: '{{.STORAGE_DB_DSN | default "postgres://postgres:postgres@localhost:5432/bowl?sslmode=disable"}}'
  STORAGE_MIGRATIONS_DIR: services/storage/db/migrations
  CLIENT_DOCKERFILE: client/Dockerfile.test
  CLIENT_TEST_IMAGE: '{{.CLIENT_TEST_IMAGE | default "bowl-client-test"}}'

env:
  GOWORK: "off"

tasks:
  default:
    desc: "List all available tasks"
    cmds:
      - task --list

  init:
    desc: "Ensure docker-compose.yaml exists (copies from example if missing)"
    status:
      - test -f {{.COMPOSE_FILE}}
    cmds:
      - cp {{.COMPOSE_EXAMPLE}} {{.COMPOSE_FILE}}
      - echo "Created {{.COMPOSE_FILE}} from {{.COMPOSE_EXAMPLE}}."

  vendor:storage:
    desc: "Vendor dependencies for storage service (ensures offline docker build)"
    internal: true
    cmds:
      - go -C services/storage mod vendor

  run:
    desc: "Start all services in background via docker compose (supports TAG=xxx, e.g. task run TAG=test)"
    deps: [init]
    env:
      STORAGE_IMAGE_NAME: '{{.STORAGE_IMAGE_NAME}}'
      TAG: '{{.TAG}}'
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d {{.CLI_ARGS}}

  build:
    desc: "Build new docker image(s) via docker compose (supports TAG=xxx, e.g. task build TAG=test)"
    deps: [init, vendor:storage]
    env:
      STORAGE_IMAGE_NAME: '{{.STORAGE_IMAGE_NAME}}'
      TAG: '{{.TAG}}'
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} build {{.CLI_ARGS}}

  build:storage:
    desc: "Build storage service docker image directly with docker build (supports TAG=xxx, e.g. task build:storage TAG=test)"
    deps: [vendor:storage]
    cmds:
      - docker build -t {{.STORAGE_IMAGE_NAME}}:{{.TAG}} -f {{.STORAGE_DOCKERFILE}} . {{.CLI_ARGS}}

  build:client:test:
    desc: "Build client test container image (bowl-client-test:latest)"
    cmds:
      - docker build -t {{.CLIENT_TEST_IMAGE}}:{{.TAG}} -f {{.CLIENT_DOCKERFILE}} client {{.CLI_ARGS}}

  down:
    desc: "Stop and remove docker compose containers and networks"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down {{.CLI_ARGS}}

  logs:
    desc: "Follow docker compose service logs"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f {{.CLI_ARGS}}

  ps:
    desc: "Show status of docker compose services"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps

  buf:generate:
    desc: "Generate code from Protocol Buffers using Buf"
    cmds:
      - buf generate {{.CLI_ARGS}}

  buf:lint:
    desc: "Lint Protocol Buffers definitions"
    cmds:
      - buf lint {{.CLI_ARGS}}

  buf:format:
    desc: "Format Protocol Buffers definitions"
    cmds:
      - buf format -w {{.CLI_ARGS}}

  buf:update:
    desc: "Update buf dependencies"
    cmds:
      - buf dep update {{.CLI_ARGS}}

  tidy:
    desc: "Run go mod tidy across all modules in workspace"
    cmds:
      - go mod tidy {{.CLI_ARGS}}
      - go -C services/storage mod tidy {{.CLI_ARGS}}
      - go -C client mod tidy {{.CLI_ARGS}}

  test:client:
    desc: "Run client static checks, build, and unit tests inside Linux Docker container"
    deps: [build:client:test]
    cmds:
      - docker run --rm
        -v bowl-go-mod-cache:/go/pkg/mod
        -v bowl-go-build-cache:/root/.cache/go-build
        -v "{{.ROOT_DIR | default .TASKFILE_DIR}}":/workspace
        -w /workspace/client
        -e GOWORK=off
        {{.CLIENT_TEST_IMAGE}}:{{.TAG}}
        sh -c 'test -z "$(gofmt -s -l .)" && go vet ./... && CGO_ENABLED=0 GOOS=linux go build -o /tmp/bowl ./cmd/bowl && /tmp/bowl version && go test -v -count=1 ./... {{.CLI_ARGS}}'

  test:client:e2e:
    desc: "Run Linux FUSE client black-box E2E tests inside privileged test container"
    deps: [init, vendor:storage, build:client:test]
    cmds:
      - defer: sh -c 'if [ "${KEEP_E2E_ENV:-0}" != "1" ]; then docker compose -p bowl -f {{.COMPOSE_FILE}} down --remove-orphans; fi'
      - docker compose -p bowl -f {{.COMPOSE_FILE}} up -d --build --wait storage-service
      - docker run --rm --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined --network bowl_bowl-net -v bowl-go-mod-cache:/go/pkg/mod -v bowl-go-build-cache:/root/.cache/go-build -v "{{.ROOT_DIR | default .TASKFILE_DIR}}":/workspace -w /workspace/client -e GOWORK=off -e BOWL_STORAGE_ENDPOINT=http://storage-service:9000 {{.CLIENT_TEST_IMAGE}}:{{.TAG}} sh -c 'CGO_ENABLED=0 GOOS=linux go build -o /tmp/bowl ./cmd/bowl && BOWL_BIN=/tmp/bowl go test -tags=e2e -v -count=1 ./e2e/... {{.CLI_ARGS}}'

  test:storage:
    desc: "Run tests for storage service"
    dir: services/storage
    cmds:
      - go test -v ./... {{.CLI_ARGS}}

  test:
    desc: "Run tests across all modules"
    cmds:
      - go test -v ./... {{.CLI_ARGS}}
      - task: test:storage
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  test:e2e:
    desc: "Run cross-service E2E tests against live docker compose services"
    deps: [init, vendor:storage]
    env:
      STORAGE_IMAGE_NAME: '{{.STORAGE_IMAGE_NAME}}'
      TAG: '{{.TAG}}'
    cmds:
      - defer: docker compose -f {{.COMPOSE_FILE}} down --remove-orphans
      - docker compose -f {{.COMPOSE_FILE}} up -d --build --wait storage-service
      - go test -tags=e2e -v -count=1 ./e2e/... {{.CLI_ARGS}}

  test:formal:
    desc: "Run deep formal state-machine and concurrent verification for storage metadata"
    dir: services/storage
    env:
      BOWL_FORMAL_REQUIRE_DB: "1"
      BOWL_FORMAL_RUNS: '{{.BOWL_FORMAL_RUNS | default "5"}}'
      BOWL_FORMAL_STEPS: '{{.BOWL_FORMAL_STEPS | default "80"}}'
    cmds:
      - go test -count=1 -v ./internal/meta -run "TestFormal" {{.CLI_ARGS}}

  lint:
    desc: "Run buf lint, gofmt check, and go vet across all modules"
    cmds:
      - buf lint
      - test -z "$(gofmt -s -l .)"
      - go vet ./...
      - go -C services/storage vet ./...
      - GOOS=linux CGO_ENABLED=0 go -C client vet ./...
      - GOOS=linux CGO_ENABLED=0 go -C client vet -tags=e2e ./e2e/...
      - go vet -tags=e2e ./e2e/...

  goose:storage:up:
    desc: "执行 storage 服务的 goose 向上迁移 (Up)"
    cmds:
      - goose -dir {{.STORAGE_MIGRATIONS_DIR}} postgres "{{.STORAGE_DB_DSN}}" up {{.CLI_ARGS}}

  goose:storage:down:
    desc: "回滚 storage 服务的最近一次 goose 迁移 (Down)"
    cmds:
      - goose -dir {{.STORAGE_MIGRATIONS_DIR}} postgres "{{.STORAGE_DB_DSN}}" down {{.CLI_ARGS}}

  goose:storage:status:
    desc: "打印 storage 服务的 goose 迁移状态 (Status)"
    cmds:
      - goose -dir {{.STORAGE_MIGRATIONS_DIR}} postgres "{{.STORAGE_DB_DSN}}" status {{.CLI_ARGS}}

  sqlc:storage:generate:
    desc: "Generate sqlc code for storage service"
    dir: services/storage
    cmds:
      - sqlc generate {{.CLI_ARGS}}

  sqlc:generate:
    desc: "Generate sqlc code across all services"
    cmds:
      - task: sqlc:storage:generate
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  mockery:storage:
    desc: "Generate mockery mocks for storage service"
    dir: services/storage
    cmds:
      - mockery {{.CLI_ARGS}}
