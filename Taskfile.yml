version: '3'

vars:
  ENV: '{{.ENV | default "dev"}}'
  COMPOSE_FILE: 'deploy/{{.ENV}}/docker-compose.yaml'
  STORAGE_DOCKERFILE: services/storage/Dockerfile
  STORAGE_IMAGE_NAME: '{{.STORAGE_IMAGE_NAME | default "bowl-storage"}}'
  TAG: '{{.TAG | default "latest"}}'
  PROTO_DIR: proto
  GEN_DIR: gen
  STORAGE_DB_DSN: '{{.STORAGE_DB_DSN | default "postgres://postgres:postgres@127.0.0.1:9432/bowl?sslmode=disable"}}'
  STORAGE_MIGRATIONS_DIR: services/storage/db/migrations
  CLIENT_DOCKERFILE: client/Dockerfile.test
  CLIENT_TEST_IMAGE: '{{.CLIENT_TEST_IMAGE | default "bowl-client-test"}}'

env:
  GOWORK: "off"
  # 本机只有一套 bowl 容器栈（固定 container_name 与端口）；固定 Compose 项目名，避免在 .worktrees/<name> 内按目录名另起项目而与主栈冲突
  COMPOSE_PROJECT_NAME: bowl

tasks:
  default:
    desc: "List all available tasks"
    cmds:
      - task --list

  vendor:storage:
    desc: "Vendor dependencies for storage service (ensures offline docker build)"
    internal: true
    cmds:
      - go -C services/storage mod vendor

  vendor:client:
    desc: "Vendor dependencies for client CLI (ensures offline docker build and test)"
    internal: true
    cmds:
      - go -C client mod vendor

  run:
    desc: "Start services via docker compose (ENV=dev|prod, default dev; supports TAG=xxx)"
    env:
      STORAGE_IMAGE_NAME: '{{.STORAGE_IMAGE_NAME}}'
      TAG: '{{.TAG}}'
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --remove-orphans {{.CLI_ARGS}}

  build:
    desc: "Build docker image(s) via docker compose (ENV=dev|prod, default dev; supports TAG=xxx)"
    deps: [vendor:storage]
    env:
      STORAGE_IMAGE_NAME: '{{.STORAGE_IMAGE_NAME}}'
      TAG: '{{.TAG}}'
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} build {{.CLI_ARGS}}

  build:storage:
    desc: "Build storage service docker image directly with docker build (supports TAG=xxx, e.g. task build:storage TAG=test)"
    deps: [vendor:storage]
    cmds:
      - docker build -t {{.STORAGE_IMAGE_NAME}}:{{.TAG}} -f {{.STORAGE_DOCKERFILE}} . {{.CLI_ARGS}}

  build:client:test:
    desc: "Build client test container image (bowl-client-test:latest)"
    cmds:
      - docker build -t {{.CLIENT_TEST_IMAGE}}:{{.TAG}} -f {{.CLIENT_DOCKERFILE}} client {{.CLI_ARGS}}

  down:
    desc: "Stop and remove docker compose containers and networks (ENV=dev|prod)"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down --remove-orphans {{.CLI_ARGS}}

  logs:
    desc: "Follow docker compose service logs (ENV=dev|prod)"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f {{.CLI_ARGS}}

  ps:
    desc: "Show status of docker compose services (ENV=dev|prod)"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps

  buf:generate:
    desc: "Generate code from Protocol Buffers using Buf"
    cmds:
      - buf generate {{.CLI_ARGS}}

  buf:lint:
    desc: "Lint Protocol Buffers definitions"
    cmds:
      - buf lint {{.CLI_ARGS}}

  buf:format:
    desc: "Format Protocol Buffers definitions"
    cmds:
      - buf format -w {{.CLI_ARGS}}

  buf:update:
    desc: "Update buf dependencies"
    cmds:
      - buf dep update {{.CLI_ARGS}}

  tidy:
    desc: "Run go mod tidy across all modules in workspace"
    cmds:
      - go mod tidy {{.CLI_ARGS}}
      - go -C services/storage mod tidy {{.CLI_ARGS}}
      - go -C client mod tidy {{.CLI_ARGS}}

  test:client:
    desc: "Build client and run unit tests inside Linux Docker container"
    deps: [vendor:client, build:client:test]
    cmds:
      - docker run --rm
        -v bowl-go-mod-cache:/go/pkg/mod
        -v bowl-go-build-cache:/root/.cache/go-build
        -v "{{.ROOT_DIR | default .TASKFILE_DIR}}":/workspace
        -w /workspace/client
        -e GOWORK=off
        -e GOFLAGS=-buildvcs=false
        {{.CLIENT_TEST_IMAGE}}:{{.TAG}}
        sh -c 'CGO_ENABLED=0 GOOS=linux go build -o /tmp/bowl ./cmd/bowl && /tmp/bowl version && go test -v -count=1 ./... {{.CLI_ARGS}}'

  test:client:e2e:
    desc: "Run Linux FUSE client black-box E2E tests inside privileged test container"
    deps: [vendor:storage, vendor:client, build:client:test]
    cmds:
      - defer: sh -c 'if [ "${KEEP_E2E_ENV:-0}" != "1" ]; then docker compose -f {{.COMPOSE_FILE}} down --remove-orphans; fi'
      - docker compose -f {{.COMPOSE_FILE}} up -d --build --wait storage-service
      - docker run --rm --device /dev/fuse --cap-add SYS_ADMIN --cap-add LINUX_IMMUTABLE --security-opt apparmor:unconfined --network bowl_bowl-net -v bowl-go-mod-cache:/go/pkg/mod -v bowl-go-build-cache:/root/.cache/go-build -v "{{.ROOT_DIR | default .TASKFILE_DIR}}":/workspace -w /workspace/client -e GOWORK=off -e GOFLAGS=-buildvcs=false -e BOWL_STORAGE_ENDPOINT=http://storage-service:9000 {{.CLIENT_TEST_IMAGE}}:{{.TAG}} sh -c 'CGO_ENABLED=0 GOOS=linux go build -o /tmp/bowl ./cmd/bowl && BOWL_BIN=/tmp/bowl go test -tags=e2e -v -count=1 ./e2e/... {{.CLI_ARGS}}'

  test:storage:
    desc: "Run tests for storage service"
    dir: services/storage
    cmds:
      - go test -v ./... {{.CLI_ARGS}}

  test:
    desc: "Run tests across all modules"
    cmds:
      - go test -v ./... {{.CLI_ARGS}}
      - task: test:storage
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  test:e2e:
    desc: "Run cross-service E2E tests against live docker compose services"
    deps: [vendor:storage]
    env:
      STORAGE_IMAGE_NAME: '{{.STORAGE_IMAGE_NAME}}'
      TAG: '{{.TAG}}'
    cmds:
      - defer: sh -c 'if [ "${KEEP_E2E_ENV:-0}" != "1" ]; then docker compose -f {{.COMPOSE_FILE}} down --remove-orphans; fi'
      - docker compose -f {{.COMPOSE_FILE}} up -d --build --wait storage-service
      - go test -tags=e2e -v -count=1 ./e2e/... {{.CLI_ARGS}}

  hooks:install:
    desc: "Configure Git core.hooksPath to .githooks (shared across main repo and worktrees)"
    cmds:
      - git config core.hooksPath .githooks

  lint:
    desc: "Run buf lint and golangci-lint across all modules"
    cmds:
      - buf lint
      - golangci-lint run ./...
      - cd services/storage && golangci-lint run --config ../../.golangci.yml ./...
      - cd client && GOOS=linux CGO_ENABLED=0 golangci-lint run --config ../.golangci.yml ./...

  goose:storage:up:
    desc: "执行 storage 服务的 goose 向上迁移 (Up)"
    cmds:
      - goose -dir {{.STORAGE_MIGRATIONS_DIR}} postgres "{{.STORAGE_DB_DSN}}" up {{.CLI_ARGS}}

  goose:storage:down:
    desc: "回滚 storage 服务的最近一次 goose 迁移 (Down)"
    cmds:
      - goose -dir {{.STORAGE_MIGRATIONS_DIR}} postgres "{{.STORAGE_DB_DSN}}" down {{.CLI_ARGS}}

  goose:storage:status:
    desc: "打印 storage 服务的 goose 迁移状态 (Status)"
    cmds:
      - goose -dir {{.STORAGE_MIGRATIONS_DIR}} postgres "{{.STORAGE_DB_DSN}}" status {{.CLI_ARGS}}

  sqlc:storage:generate:
    desc: "Generate sqlc code for storage service"
    dir: services/storage
    cmds:
      - sqlc generate {{.CLI_ARGS}}

  sqlc:generate:
    desc: "Generate sqlc code across all services"
    cmds:
      - task: sqlc:storage:generate
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  docs:install:
    desc: "Install VitePress documentation dependencies"
    cmds:
      - npm --prefix docs install

  docs:gen:
    desc: "Generate RPC API reference documentation from proto"
    cmds:
      - node docs/scripts/gen-rpc-doc.mjs

  docs:dev:
    desc: "Start VitePress documentation dev server"
    deps: [docs:gen]
    cmds:
      - npm --prefix docs run dev -- {{.CLI_ARGS}}

  docs:build:
    desc: "Build VitePress documentation static site"
    deps: [docs:gen]
    cmds:
      - npm --prefix docs run build

  docs:preview:
    desc: "Preview built VitePress documentation site"
    cmds:
      - npm --prefix docs run preview -- {{.CLI_ARGS}}
