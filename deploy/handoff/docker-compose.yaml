# 本地 ⇄ 云端交接的开发栈：两个互相独立的存储节点（各自的控制面库与数据卷），
# 只通过一个共享的远端交换数据。用来在一台机器上复现“本地开发、切到云端、再切回来”。
#
#   local  http://127.0.0.1:9100
#   cloud  http://127.0.0.1:9200
#
# 远端默认是一个共享卷（顶替对象存储）。要换成真实的 S3 兼容存储，设置
# HANDOFF_REMOTE_URL / HANDOFF_S3_ACCESS_KEY / HANDOFF_S3_SECRET_KEY 后再启动。
# 项目名与 deploy/dev 不同，两套栈互不影响。
#
# 可选的 compute profile 再起一个独立的 Docker（cloud-compute），顶替“云端的算力机器”：
# 它和本机 Docker 不共享镜像、容器和文件系统，只和 cloud 存储节点在同一个内网里。
#   docker compose --profile compute up -d
#   bowl node set cloud --endpoint http://127.0.0.1:9200 \
#        --docker tcp://127.0.0.1:2385 --sandbox-endpoint http://172.31.250.10:9000
# 之后 bowl sandbox move <id> --to cloud 会把沙箱真正起在那个 Docker 上。
name: bowl-handoff

x-storage: &storage
  image: ${STORAGE_IMAGE_NAME:-bowl-storage}:${TAG:-latest}
  build:
    context: ../..
    dockerfile: services/storage/Dockerfile
  restart: unless-stopped
  env_file:
    - ../dev/storage.env
  healthcheck:
    test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 2s
  networks:
    - handoff-net

x-storage-env: &storage-env
  OTEL_ENABLED: "false"
  LOG_LEVEL: info
  HANDOFF_REMOTE_DIR: /var/lib/bowl/remote
  HANDOFF_REMOTE_URL: ${HANDOFF_REMOTE_URL:-}
  HANDOFF_S3_ACCESS_KEY: ${HANDOFF_S3_ACCESS_KEY:-}
  HANDOFF_S3_SECRET_KEY: ${HANDOFF_S3_SECRET_KEY:-}
  # 开发栈用较短的同步周期，方便观察；服务默认值是 30s。
  HANDOFF_SYNC_INTERVAL: ${HANDOFF_SYNC_INTERVAL:-10s}
  STORAGE_AUTH_TOKEN: ${BOWL_TOKEN:-}

x-migration: &migration
  image: bowl-storage-migration:latest
  build:
    context: ../..
    dockerfile: services/storage/Dockerfile.migration
  volumes:
    - ../../services/storage/db/migrations:/migrations:ro
  depends_on:
    postgres:
      condition: service_healthy
  restart: "no"
  networks:
    - handoff-net

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bowl_local
    configs:
      - source: create-cloud-db
        target: /docker-entrypoint-initdb.d/10-cloud.sql
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bowl_cloud"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    networks:
      - handoff-net

  migration-local:
    <<: *migration
    command: ["-dir", "/migrations", "postgres", "postgres://postgres:postgres@postgres:5432/bowl_local?sslmode=disable", "up"]

  migration-cloud:
    <<: *migration
    command: ["-dir", "/migrations", "postgres", "postgres://postgres:postgres@postgres:5432/bowl_cloud?sslmode=disable", "up"]

  storage-local:
    <<: *storage
    environment:
      <<: *storage-env
      HANDOFF_NODE_ID: local
      DB_DSN: postgres://postgres:postgres@postgres:5432/bowl_local?sslmode=disable
    ports:
      - "${LOCAL_PORT:-9100}:9000"
    volumes:
      - local_data:/var/lib/bowl/data
      - remote:/var/lib/bowl/remote
    depends_on:
      migration-local:
        condition: service_completed_successfully

  storage-cloud:
    <<: *storage
    environment:
      <<: *storage-env
      HANDOFF_NODE_ID: cloud
      DB_DSN: postgres://postgres:postgres@postgres:5432/bowl_cloud?sslmode=disable
    ports:
      - "${CLOUD_PORT:-9200}:9000"
    volumes:
      - cloud_data:/var/lib/bowl/data
      - remote:/var/lib/bowl/remote
    depends_on:
      migration-cloud:
        condition: service_completed_successfully
    networks:
      handoff-net:
        # 固定内网地址：cloud-compute 里的沙箱按这个地址访问云端存储。
        ipv4_address: 172.31.250.10

  # 顶替“云端算力机器”的独立 Docker。仅用于开发：特权容器，API 不带认证，只绑定在本机回环地址上。
  cloud-compute:
    image: docker:dind
    profiles: ["compute"]
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--tls=false"]
    ports:
      - "127.0.0.1:${CLOUD_DOCKER_PORT:-2385}:2375"
    volumes:
      - cloud_compute:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    networks:
      - handoff-net

configs:
  create-cloud-db:
    content: |
      CREATE DATABASE bowl_cloud;

volumes:
  postgres_data:
  local_data:
  cloud_data:
  cloud_compute:
  remote:

networks:
  handoff-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.250.0/24
