syntax = "proto3";

package bowl.v1;

import "bowl/v1/dir.proto";
import "bowl/v1/file.proto";
import "bowl/v1/inode.proto";
import "bowl/v1/lock.proto";
import "bowl/v1/xattr.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/starsrc/bowl/gen/go/bowl/v1;bowlv1";

// =========================================================================
// 服务接口契约 (Service Contracts)
// =========================================================================

// StorageService 定义 Bowl Storage 的核心数据面与 FUSE 协议服务端 RPC 契约。
// 承担挂载会话维护、一写多读 (OWMR) 租约协调、FUSE 元数据操作、流式目录项读取、
// 高性能数据 I/O（瘦客户端直通与冷热分层缓存）、并发锁控制及扩展属性存取职责。
service StorageService {
  // =========================================================================
  // AC-2: 挂载会话与一写多读 (OWMR) 租约生命周期 RPC
  // =========================================================================

  // 挂载虚拟磁盘并建立客户端会话。
  // 基于 disk_id 与 client_id 校验权限，签发全局唯一 session_id，
  // 返回根目录 Inode、Statfs 统计以及只读/写租约标识与有效期。
  rpc Mount(MountRequest) returns (MountResponse);

  // 卸载客户端挂载会话。
  // 注销指定 session_id，主动释放排他性写租约并回收关联的未决资源。
  rpc Unmount(UnmountRequest) returns (UnmountResponse);

  // 心跳保活与写租约续期。
  // 维持会话活跃状态，续期持有中的排他性写租约，并感知服务端的租约撤回/降级通知。
  rpc KeepAlive(KeepAliveRequest) returns (KeepAliveResponse);

  // =========================================================================
  // AC-3: FUSE 元数据与目录树操作 RPC
  // =========================================================================

  // 在指定目录下按名称查找子条目（对应 FUSE_LOOKUP）。
  rpc Lookup(LookupRequest) returns (LookupResponse);

  // 获取文件或目录的元数据属性（对应 FUSE_GETATTR）。
  rpc GetAttr(GetAttrRequest) returns (GetAttrResponse);

  // 修改文件或目录的元数据属性（对应 FUSE_SETATTR）。
  rpc SetAttr(SetAttrRequest) returns (SetAttrResponse);

  // 校验调用方对指定节点的访问权限（对应 FUSE_ACCESS）。
  rpc Access(AccessRequest) returns (AccessResponse);

  // 获取文件系统全局容量与使用量统计信息（对应 FUSE_STATFS）。
  rpc Statfs(StatfsRequest) returns (StatfsResponse);

  // 通知服务端释放单个 Inode 的查找引用计数（对应 FUSE_FORGET）。
  rpc Forget(ForgetRequest) returns (ForgetResponse);

  // 批量通知服务端释放多个 Inode 的查找引用计数（对应 FUSE_BATCH_FORGET）。
  rpc BatchForget(BatchForgetRequest) returns (BatchForgetResponse);

  // 原子创建并打开普通文件（对应 FUSE_CREATE）。
  rpc Create(CreateRequest) returns (CreateResponse);

  // 创建特殊设备文件、管道或套接字节点（对应 FUSE_MKNOD）。
  rpc Mknod(MknodRequest) returns (MknodResponse);

  // 创建子目录（对应 FUSE_MKDIR）。
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);

  // 删除空子目录（对应 FUSE_RMDIR）。
  rpc Rmdir(RmdirRequest) returns (RmdirResponse);

  // 删除硬链接或常规文件（对应 FUSE_UNLINK）。
  rpc Unlink(UnlinkRequest) returns (UnlinkResponse);

  // 创建硬链接（对应 FUSE_LINK）。
  rpc Link(LinkRequest) returns (LinkResponse);

  // 创建符号链接（软链接，对应 FUSE_SYMLINK）。
  rpc Symlink(SymlinkRequest) returns (SymlinkResponse);

  // 读取符号链接目标路径（对应 FUSE_READLINK）。
  rpc Readlink(ReadlinkRequest) returns (ReadlinkResponse);

  // 原子重命名或交换文件/目录（对应 FUSE_RENAME / FUSE_RENAME2）。
  rpc Rename(RenameRequest) returns (RenameResponse);

  // 打开目录以准备遍历（对应 FUSE_OPENDIR）。
  rpc OpenDir(OpenDirRequest) returns (OpenDirResponse);

  // 流式分批读取目录项内容（对应 FUSE_READDIR）。
  rpc ReadDir(ReadDirRequest) returns (ReadDirResponse);

  // 流式分批读取目录项内容并预取 Inode 完整属性（对应 FUSE_READDIRPLUS）。
  rpc ReadDirPlus(ReadDirPlusRequest) returns (ReadDirPlusResponse);

  // 关闭并释放打开的目录句柄（对应 FUSE_RELEASEDIR）。
  rpc ReleaseDir(ReleaseDirRequest) returns (ReleaseDirResponse);

  // 同步目录内容与元数据至持久存储（对应 FUSE_FSYNCDIR）。
  rpc FsyncDir(FsyncDirRequest) returns (FsyncDirResponse);

  // =========================================================================
  // AC-4: FUSE 文件 I/O、锁与扩展属性操作 RPC
  // =========================================================================

  // 打开已有文件并分配服务端文件句柄（对应 FUSE_OPEN）。
  rpc Open(OpenRequest) returns (OpenResponse);

  // 瘦客户端模式文件数据读取（对应 FUSE_READ）。
  rpc Read(ReadRequest) returns (ReadResponse);

  // 瘦客户端模式文件数据写入（对应 FUSE_WRITE）。
  rpc Write(WriteRequest) returns (WriteResponse);

  // 文件关闭前刷新脏数据与清理文件锁（对应 FUSE_FLUSH）。
  rpc Flush(FlushRequest) returns (FlushResponse);

  // 关闭并释放打开的文件句柄与相关租约（对应 FUSE_RELEASE）。
  rpc Release(ReleaseRequest) returns (ReleaseResponse);

  // 强制同步文件数据与元数据至持久存储（对应 FUSE_FSYNC）。
  rpc Fsync(FsyncRequest) returns (FsyncResponse);

  // 文件空间预分配、打洞与区间重构（对应 FUSE_FALLOCATE）。
  rpc Fallocate(FallocateRequest) returns (FallocateResponse);

  // 跨文件或同文件内的区间秒级元数据克隆（对应 FUSE_COPY_FILE_RANGE）。
  rpc CopyFileRange(CopyFileRangeRequest) returns (CopyFileRangeResponse);

  // 探测稀疏文件的数据与空洞区间偏移量（对应 FUSE_LSEEK）。
  rpc Lseek(LseekRequest) returns (LseekResponse);

  // 测试查询 POSIX 字节区间记录锁（对应 FUSE_GETLK）。
  rpc GetLk(GetLkRequest) returns (GetLkResponse);

  // 非阻塞获取或释放 POSIX 字节区间记录锁（对应 FUSE_SETLK）。
  rpc SetLk(SetLkRequest) returns (SetLkResponse);

  // 阻塞等待获取 POSIX 字节区间记录锁（对应 FUSE_SETLKW）。
  rpc SetLkw(SetLkwRequest) returns (SetLkwResponse);

  // 获取或释放 BSD 风格整体文件互斥锁（对应 flock 系统调用）。
  rpc Flock(FlockRequest) returns (FlockResponse);

  // 获取指定扩展属性值（对应 FUSE_GETXATTR）。
  rpc GetXAttr(GetXAttrRequest) returns (GetXAttrResponse);

  // 设置指定扩展属性键值对（对应 FUSE_SETXATTR）。
  rpc SetXAttr(SetXAttrRequest) returns (SetXAttrResponse);

  // 列出指定节点的所有扩展属性键名（对应 FUSE_LISTXATTR）。
  rpc ListXAttr(ListXAttrRequest) returns (ListXAttrResponse);

  // 删除指定节点的扩展属性（对应 FUSE_REMOVEXATTR）。
  rpc RemoveXAttr(RemoveXAttrRequest) returns (RemoveXAttrResponse);
}

// =============================================================================
// AC-2: 挂载会话与一写多读 (OWMR) 租约生命周期模型
// =============================================================================

// MountRequest 表示挂载虚拟磁盘的请求参数模型。
message MountRequest {
  // 目标虚拟磁盘全局唯一标识 ID。
  string disk_id = 1;

  // 发起挂载的客户端/宿主机唯一标识 ID（例如 Node/Pod/VM 标识）。
  string client_id = 2;

  // 是否以只读模式挂载。
  // 在 Bowl Storage OWMR 架构中，若为 true 则以只读共享身份挂载；
  // 若为 false 则尝试向服务端申请排他性写租约。
  bool read_only = 3;
}

// MountResponse 表示挂载虚拟磁盘的响应结果。
message MountResponse {
  // 服务端为本次挂载签发的全局唯一会话标识 ID。
  // 后续所有数据面与元数据 RPC 均需携带该 ID 以维护租约与访问会话上下文。
  string session_id = 1;

  // 文件系统根目录 Inode 元数据属性（根节点 ino 通常固定为 1）。
  Inode root_inode = 2;

  // 文件系统全局容量配额与使用量统计信息。
  Statfs statfs = 3;

  // 是否成功获得排他性写租约。
  // 当 read_only 为 false 且无并发写租约冲突时为 true；
  // 若只读挂载或写租约已被其他客户端占用，则为 false。
  bool is_write_lease = 4;

  // 当前租约到期绝对时间戳。
  google.protobuf.Timestamp lease_expire_time = 5;

  // 租约有效持续时长与建议心跳保活间隔。
  google.protobuf.Duration lease_timeout = 6;
}

// UnmountRequest 表示卸载客户端会话的请求参数模型。
message UnmountRequest {
  // 待卸载的挂载会话唯一标识 ID。
  string session_id = 1;

  // 是否强制卸载。
  // 值为 true 时丢弃未同步脏数据，强制注销服务端会话并释放写租约。
  bool force = 2;
}

// UnmountResponse 表示卸载客户端会话的响应结果。
message UnmountResponse {}

// KeepAliveRequest 表示心跳保活与租约续期的请求参数模型。
message KeepAliveRequest {
  // 挂载会话唯一标识 ID。
  string session_id = 1;
}

// KeepAliveResponse 表示心跳保活与租约续期的响应结果。
message KeepAliveResponse {
  // 当前客户端是否继续持有排他性写租约。
  bool is_write_lease = 1;

  // 续期后的租约过期绝对时间戳。
  google.protobuf.Timestamp lease_expire_time = 2;

  // 服务端是否要求撤回或降级写租约。
  // 值为 true 时指示客户端应立即执行脏缓存刷盘并降级为只读模式。
  bool lease_revocation = 3;
}
