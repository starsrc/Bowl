syntax = "proto3";

package disk.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/starsrc/bowl/gen/go/disk/v1;diskv1";

// DiskService 提供虚拟磁盘生命周期管理、容量配额账本与 POSIX StatFS 统计能力。
service DiskService {
  // CreateDisk 创建新的虚拟磁盘实体并分配初始根目录 Inode 与容量上限。
  rpc CreateDisk(CreateDiskRequest) returns (CreateDiskResponse);

  // GetDisk 查询指定 disk_id 的磁盘实体详情与配额状态。
  rpc GetDisk(GetDiskRequest) returns (GetDiskResponse);

  // UpdateDisk 更新指定磁盘的名称或容量配额上限。
  rpc UpdateDisk(UpdateDiskRequest) returns (UpdateDiskResponse);

  // DeleteDisk 删除指定磁盘实体。
  rpc DeleteDisk(DeleteDiskRequest) returns (DeleteDiskResponse);

  // StatFS 查询指定磁盘的字节容量与 POSIX 4096 字节块统计信息。
  rpc StatFS(StatFSRequest) returns (StatFSResponse);

  // UpdateDiskUsage 按带符号增量原子调整磁盘已用字节数。
  rpc UpdateDiskUsage(UpdateDiskUsageRequest) returns (UpdateDiskUsageResponse);
}

// Disk 描述一个独立的虚拟磁盘实体及其配额状态。
message Disk {
  // 磁盘全局唯一标识符（UUID 字符串格式，非全零 nil UUID）。
  string disk_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).cel = {
      id: "disk_disk_id_not_nil"
      message: "disk_id must not be nil UUID"
      expression: "this != '00000000-0000-0000-0000-000000000000'"
    }
  ];

  // 磁盘名称（最大 255 字节，严禁包含空字节 '\x00'）。
  string name = 2 [
    (buf.validate.field).string.max_bytes = 255,
    (buf.validate.field).cel = {
      id: "disk_name_no_nul"
      message: "name cannot contain NUL byte"
      expression: "!this.contains('\\x00')"
    }
  ];

  // 一对一绑定的根目录 Inode 编号（必须在 int64 正数区间内）。
  uint64 root_ino = 3 [
    (buf.validate.field).uint64.gt = 0,
    (buf.validate.field).uint64.lte = 9223372036854775807
  ];

  // 容量配额上限字节数（必须在 int64 正数区间内）。
  uint64 max_bytes = 4 [
    (buf.validate.field).uint64.gt = 0,
    (buf.validate.field).uint64.lte = 9223372036854775807
  ];

  // 当前已用字节数（不能超过 int64 正数最大值）。
  uint64 used_bytes = 5 [(buf.validate.field).uint64.lte = 9223372036854775807];

  // 磁盘创建时间戳（必填）。
  google.protobuf.Timestamp created_at = 6 [(buf.validate.field).required = true];

  // 磁盘最后更新时间戳（必填）。
  google.protobuf.Timestamp updated_at = 7 [(buf.validate.field).required = true];
}

// CreateDiskRequest 定义 CreateDisk 接口输入参数。
message CreateDiskRequest {
  // 磁盘名称（最大 255 字节，严禁包含空字节 '\x00'）。
  string name = 1 [
    (buf.validate.field).string.max_bytes = 255,
    (buf.validate.field).cel = {
      id: "create_disk_name_no_nul"
      message: "name cannot contain NUL byte"
      expression: "!this.contains('\\x00')"
    }
  ];

  // 一对一绑定的根目录 Inode 编号（必须在 int64 正数区间内）。
  uint64 root_ino = 2 [
    (buf.validate.field).uint64.gt = 0,
    (buf.validate.field).uint64.lte = 9223372036854775807
  ];

  // 容量配额上限字节数（必须在 int64 正数区间内）。
  uint64 max_bytes = 3 [
    (buf.validate.field).uint64.gt = 0,
    (buf.validate.field).uint64.lte = 9223372036854775807
  ];
}

// CreateDiskResponse 定义 CreateDisk 接口输出参数。
message CreateDiskResponse {
  // 创建成功的磁盘实体。
  Disk disk = 1 [(buf.validate.field).required = true];
}

// GetDiskRequest 定义 GetDisk 接口输入参数。
message GetDiskRequest {
  // 目标磁盘唯一标识符（UUID 格式，非全零 nil UUID）。
  string disk_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).cel = {
      id: "get_disk_disk_id_not_nil"
      message: "disk_id must not be nil UUID"
      expression: "this != '00000000-0000-0000-0000-000000000000'"
    }
  ];
}

// GetDiskResponse 定义 GetDisk 接口输出参数。
message GetDiskResponse {
  // 查询到的磁盘实体。
  Disk disk = 1 [(buf.validate.field).required = true];
}

// UpdateDiskRequest 定义 UpdateDisk 接口输入参数。
message UpdateDiskRequest {
  option (buf.validate.message).cel = {
    id: "update_disk_has_update"
    message: "at least one of name or max_bytes must be set"
    expression: "has(this.name) || has(this.max_bytes)"
  };

  // 目标磁盘唯一标识符（UUID 格式，非全零 nil UUID）。
  string disk_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).cel = {
      id: "update_disk_disk_id_not_nil"
      message: "disk_id must not be nil UUID"
      expression: "this != '00000000-0000-0000-0000-000000000000'"
    }
  ];

  // 待更新的磁盘名称（最大 255 字节，严禁包含空字节 '\x00'）。
  optional string name = 2 [
    (buf.validate.field).string.max_bytes = 255,
    (buf.validate.field).cel = {
      id: "update_disk_name_no_nul"
      message: "name cannot contain NUL byte"
      expression: "!this.contains('\\x00')"
    }
  ];

  // 待更新的容量配额上限（必须在 int64 正数区间内）。
  optional uint64 max_bytes = 3 [
    (buf.validate.field).uint64.gt = 0,
    (buf.validate.field).uint64.lte = 9223372036854775807
  ];
}

// UpdateDiskResponse 定义 UpdateDisk 接口输出参数。
message UpdateDiskResponse {
  // 更新后的磁盘实体。
  Disk disk = 1 [(buf.validate.field).required = true];
}

// DeleteDiskRequest 定义 DeleteDisk 接口输入参数。
message DeleteDiskRequest {
  // 目标磁盘唯一标识符（UUID 格式，非全零 nil UUID）。
  string disk_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).cel = {
      id: "delete_disk_disk_id_not_nil"
      message: "disk_id must not be nil UUID"
      expression: "this != '00000000-0000-0000-0000-000000000000'"
    }
  ];
}

// DeleteDiskResponse 定义 DeleteDisk 接口输出参数。
message DeleteDiskResponse {}

// StatFSRequest 定义 StatFS 接口输入参数。
message StatFSRequest {
  // 目标磁盘唯一标识符（UUID 格式，非全零 nil UUID）。
  string disk_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).cel = {
      id: "statfs_disk_id_not_nil"
      message: "disk_id must not be nil UUID"
      expression: "this != '00000000-0000-0000-0000-000000000000'"
    }
  ];
}

// StatFSResponse 定义 StatFS 接口输出参数，对齐 POSIX 4096 字节块统计语义。
message StatFSResponse {
  // 磁盘总容量字节数。
  uint64 total_bytes = 1;

  // 当前已使用容量字节数。
  uint64 used_bytes = 2;

  // 当前剩余可用容量字节数。
  uint64 avail_bytes = 3;

  // 文件系统基础块大小（字节，固定为 4096）。
  uint32 bsize = 4;

  // 文件系统基本分配单元大小（字节，固定为 4096）。
  uint32 frsize = 5;

  // 总数据块数量（基于 4096 字节块换算，至少为 1）。
  uint64 blocks = 6;

  // 空闲数据块数量。
  uint64 bfree = 7;

  // 非特权用户可用数据块数量。
  uint64 bavail = 8;

  // 总 Inode 数量（不设限时填 0）。
  uint64 files = 9;

  // 空闲 Inode 数量（不设限时填 0）。
  uint64 ffree = 10;

  // 文件名最大长度（字节，固定为 255）。
  uint32 namelen = 11;
}

// UpdateDiskUsageRequest 定义 UpdateDiskUsage 接口输入参数。
message UpdateDiskUsageRequest {
  // 目标磁盘唯一标识符（UUID 格式，非全零 nil UUID）。
  string disk_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).cel = {
      id: "update_disk_usage_disk_id_not_nil"
      message: "disk_id must not be nil UUID"
      expression: "this != '00000000-0000-0000-0000-000000000000'"
    }
  ];

  // 容量变更带符号增量（正数表示占用空间，负数表示释放空间，0 为幂等短路）。
  int64 delta_bytes = 2;
}

// UpdateDiskUsageResponse 定义 UpdateDiskUsage 接口输出参数。
message UpdateDiskUsageResponse {
  // 调整后的磁盘实体。
  Disk disk = 1 [(buf.validate.field).required = true];
}
