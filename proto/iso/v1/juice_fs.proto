syntax = "proto3";

package iso.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/starsrc/iso/gen/go/iso/v1;isov1";

// Slice 表示 JuiceFS 存储引擎中的数据切片元数据模型。
// 对齐 JuiceFS 切片存储架构（Slice 抽象）。在 JuiceFS 中，大文件被划分为定长的 64MB Chunk，
// 每次向文件发生的连续写入操作均生成一个独立的不可变切片（Slice 对象）。
message Slice {
  // 切片全局唯一标识 ID（Slice ID）。
  // 对应 JuiceFS 底层数据块存储键（Key）。
  // 在 ISO Storage 架构中，用于在服务端 NVMe SSD 本地热缓存区或远端 B2 冷对象存储中寻址与定位实际物理数据对象。
  uint64 id = 1;

  // 切片在所属 64MB Chunk 内部的起始逻辑偏移量（字节数，取值范围为 0 <= offset < 64MB）。
  // 对应 JuiceFS Slice.ChunkOff。指示写入数据在所属 64MB 逻辑块内的对齐位置。
  uint32 offset = 2;

  // 切片有效数据的写入长度（字节数）。
  // 对应 JuiceFS Slice.Length。
  uint32 length = 3;

  // 切片实际物理存储大小（字节数）。
  // 对应 JuiceFS Slice.Size。在启用压缩或预分配时可能与有效长度不同。
  uint32 size = 4;

  // 切片在底层物理数据对象（由 id 标识）内部的起始读取偏移量（默认值为 0）。
  // 对应 JuiceFS Slice.Off。
  // 当发生切片裁剪（Cut）、区间重叠覆写、零拷贝克隆（Clone）或碎片整理压实（Compaction）时，
  // 指示从底层物理不可变对象的第几字节开始读取，100% 完备对齐 JuiceFS 的 (pos, id, size, off, len) 五元组切片模型。
  uint32 src_offset = 5;
}

// Chunk 表示文件在 JuiceFS 架构中的 64MB 逻辑分块元数据模型。
// 对齐 JuiceFS 逻辑分块模型。JuiceFS 将任意规模的文件按 64MB 固定步长切分为连续逻辑分块。
// 每个 Chunk 包含按写入顺序排列的一组不可变 Slice 序列。
message Chunk {
  // 所属文件的 Inode 编号。
  uint64 ino = 1;

  // Chunk 在所属文件内的逻辑索引号（从 0 开始连续自增，每个 Chunk 固定为 64MB）。
  // 文件内字节偏移量计算公式：file_offset = index * 64MB + slice.offset。
  uint32 index = 2;

  // 构成该 Chunk 的数据切片列表。
  // 遵循 JuiceFS 切片叠加覆盖模型（Slice Overlay）：后写入的切片具有更高优先级，
  // 逻辑读取时根据写入顺序自后向前裁决重叠区间，覆盖先前写入重叠区域的数据。
  repeated Slice slices = 3;
}

// WriteSliceOp 表示向 JuiceFS 元数据引擎提交写入数据切片的操作描述模型。
// 对应 JuiceFS 元数据引擎的核心切片写入提交流程（例如 meta.Engine.WriteSlice）。
// 客户端在将切片物理数据写入服务端本地 NVMe SSD 缓存区或直接上传至远端对象存储后，
// 发起该操作将切片元数据原子注册至所属 Inode 的指定 Chunk 索引中，并同步更新文件修改时间。
message WriteSliceOp {
  // 目标文件的 Inode 编号。
  uint64 ino = 1;

  // 目标 Chunk 在文件内的逻辑索引号（从 0 开始，每个 Chunk 固定为 64MB）。
  uint32 chunk_index = 2;

  // 本次提交写入的数据切片元数据。
  Slice slice = 3;

  // 文件最后修改时间戳（mtime，纳秒精度）。
  // 提交写入切片时原子更新 Inode 的修改时间，保证多客户端并发与缓存校验时序一致。
  google.protobuf.Timestamp mtime = 4;

  // 文件打开句柄（用于 OWMR 写租约有效性校验与并发锁状态检查）。
  uint64 fh = 5;
}

// TruncateOp 表示针对 JuiceFS 文件的容量截断操作描述模型。
// 对应 POSIX truncate(2) / ftruncate(2) 系统调用以及 JuiceFS 元数据引擎的截断实现（例如 meta.Engine.Truncate）。
// 支持向下截断（释放超出边界的 Chunk 与 Slice 索引）与向上截断（扩容产生稀疏空洞文件）。
message TruncateOp {
  // 目标文件的 Inode 编号。
  uint64 ino = 1;

  // 目标文件的打开句柄标识（若由 ftruncate 系统调用触发；若无已打开文件句柄可置为 0）。
  // 用于配合服务端一写多读（OWMR）租约校验与锁状态检查。
  uint64 fh = 2;

  // 目标截断文件大小（字节数）。
  // 若目标大小小于当前文件大小，服务端将执行末尾切片裁剪并回收超出范围的 Chunk；
  // 若目标大小大于当前文件大小，服务端将扩展 Inode 元数据大小并生成逻辑稀疏区间。
  uint64 size = 3;
}

// ReadChunkOp 表示读取指定 64MB Chunk 下所有不可变切片元数据的操作描述模型。
// 对应 JuiceFS 数据引擎的切片路由读取接口。客户端在执行读 I/O 或定位数据前，
// 调用该操作获取目标 Chunk 内按写入时序叠加的所有 Slice 列表，据此在本地 NVMe SSD 热缓存
// 或 B2 冷对象存储中执行并发区间读取。
message ReadChunkOp {
  // 目标文件的 Inode 编号。
  uint64 ino = 1;

  // 目标 Chunk 在所属文件内的逻辑索引号（从 0 开始自增，每个 Chunk 固定为 64MB）。
  uint32 chunk_index = 2;
}

// NewSliceOp 表示向元数据引擎申请分配全局唯一切片 ID 的请求抽象模型。
// 对应 JuiceFS 的 Slice ID 分配机制。客户端在向文件写入新数据生成 Slice 物理对象前，
// 必须从服务端申请全局唯一的 Slice ID，以作为底层 NVMe SSD 缓存或 B2 对象存储的物理对象寻址键。
// 支持批量申请以减少 RPC 交互频率并提升高并发写入吞吐。
message NewSliceOp {
  // 期望批量预分配的全局唯一 Slice ID 数量（默认/最小值为 1）。
  uint32 count = 1;

  // 申请切片关联的目标文件 Inode 编号（可选，用于配额监控与用量审计）。
  uint64 ino = 2;
}

// CompactChunkOp 表示触发指定 Chunk 切片碎片压实合并的操作描述模型。
// 对应 JuiceFS 核心的 Chunk 压实机制（Compaction）。当文件经历频繁随机覆写或小 I/O 追加写后，
// 单个 64MB Chunk 内会堆积大量重叠切片（Slice），导致读放大加剧与元数据膨胀。
// 调用该操作将触发服务端或异步任务将该 Chunk 内的多个碎片 Slice 读出并合并压实为少量规整的不可变切片，
// 原子更新元数据 Chunk 索引并触发旧切片的垃圾回收。
message CompactChunkOp {
  // 目标文件的 Inode 编号。
  uint64 ino = 1;

  // 待压实合并的目标 Chunk 逻辑索引号。
  uint32 chunk_index = 2;

  // 是否强制执行压实（即便切片碎片数量未达到系统配置的自动压实阈值）。
  bool force = 3;
}

// SliceRef 表示物理切片的引用计数与写时复制（CoW）/克隆追踪模型。
// 对齐 JuiceFS 与 ISO Storage 依托不可变切片（Immutable Slice）实现的秒级克隆与元数据快照机制。
// 当多个 Inode 或同一 Inode 的多个历史版本通过 CopyFileRange / Clone 共享同一个底层物理切片对象时，
// 维护切片的全局引用计数（ref_count）。仅当所有引用均被解绑删除且引用计数归零时，底层物理存储资源方可安全被 GC 回收。
message SliceRef {
  // 物理切片全局唯一标识 ID（Slice ID）。
  uint64 slice_id = 1;

  // 当前指向该物理切片的逻辑引用计数（Ref Count）。
  // 每次 Clone 或区间共享该切片时计数递增；切片被裁剪、覆写覆盖或所属 Inode 被删除时递减。
  uint32 ref_count = 2;

  // 切片实际物理存储大小（字节数，用于存储容量核算与计费配额）。
  uint32 size = 3;

  // 切片首次分配创建的时间戳。
  google.protobuf.Timestamp created_at = 4;

  // 切片引用计数归零、标记进入延迟垃圾回收（GC）队列的时间戳（未进入 GC 队列时为空）。
  google.protobuf.Timestamp deleted_at = 5;
}
