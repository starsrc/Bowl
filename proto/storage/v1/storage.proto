  uint32 flags = 6;

  // 可选的客户端会话租约标识 (session_id)。必须大于 0 且在 int64 正数范围内 (<= 9223372036854775807)。
  optional uint64 session_id = 7 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
}

// CreateResponse 包含新创建常规文件的元数据、分配的文件句柄以及 FUSE 内核缓存有效时间。
