  optional uint64 size = 5 [(buf.validate.field).uint64.lte = 9223372036854775807];
  optional google.protobuf.Timestamp atime = 6;
  optional google.protobuf.Timestamp mtime = 7;
  bool atime_now = 8;
  bool mtime_now = 9;

  optional uint64 fh = 10 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];

  string disk_id = 11 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).cel = {
      id: "setattr_disk_id_not_nil"
      message: "disk_id must not be nil UUID"
      expression: "this != '00000000-0000-0000-0000-000000000000'"
    }
  ];

  bool ctime_now = 12;
  optional uint32 flags = 13 [(buf.validate.field).uint32.lte = 2147483647];

  uint64 epoch = 14 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];

  string branch = 15 [
    (buf.validate.field).string = {
