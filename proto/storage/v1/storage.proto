syntax = "proto3";

package storage.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/starsrc/bowl/gen/go/storage/v1;storagev1";

// StorageService 提供针对分布式文件系统的元数据操作与 FUSE 协议对接能力。
service StorageService {
  // Lookup 执行单级目录项查找。
  // 根据父目录 Inode 与目标子项名称获取对应的 Inode 元数据及内核缓存时效。
  // 若父节点或目标子项不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若父节点存在但非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  rpc Lookup(LookupRequest) returns (LookupResponse);

  // SetAttr 修改指定 Inode 的元数据属性（对接 Linux FUSE FUSE_SETATTR 协议）。
  // 遵循按需部分更新语义。若节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)；
  // 若违反 POSIX 语义（如对目录设置大小），必须返回 gRPC 标准状态码 InvalidArgument 或相应错误。
  rpc SetAttr(SetAttrRequest) returns (SetAttrResponse);
}

// LookupRequest 定义 Lookup 接口输入参数。
message LookupRequest {
  // 父目录的 Inode 编号。根目录通常为 1。
  uint64 parent_ino = 1 [(buf.validate.field).uint64.gt = 0];

  // 待查找的子项名称（文件或目录名）。
  // 长度必须在 1 到 255 字节之间，且严禁包含路径分隔符 '/' 与空字节 '\x00'。
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_bytes = 255,
    (buf.validate.field).string.pattern = "^[^/\\x00]+$"
  ];
}

// LookupResponse 包含查找命中的节点元数据以及 FUSE 内核缓存有效时间。
message LookupResponse {
  // 命中的目标 Inode 实体元数据。
  Inode inode = 1 [(buf.validate.field).required = true];

  // 目录项 (dentry) 在 FUSE 内核中的有效缓存时长（秒）。
  double entry_timeout_seconds = 2 [(buf.validate.field).double.gte = 0];

  // 属性 (attr) 在 FUSE 内核中的有效缓存时长（秒）。
  double attr_timeout_seconds = 3 [(buf.validate.field).double.gte = 0];
}

// SetAttrRequest 定义 SetAttr 接口输入参数。
// 遵循按需部分更新语义，未显式设置的属性保持原值不变。
message SetAttrRequest {
  option (buf.validate.message).cel = {
    id: "setattr_atime_conflict"
    message: "atime and atime_now cannot both be set"
    expression: "!(has(this.atime) && this.atime_now)"
  };
  option (buf.validate.message).cel = {
    id: "setattr_mtime_conflict"
    message: "mtime and mtime_now cannot both be set"
    expression: "!(has(this.mtime) && this.mtime_now)"
  };
  option (buf.validate.message).cel = {
    id: "setattr_has_update"
    message: "at least one attribute must be updated"
    expression: "has(this.mode) || has(this.uid) || has(this.gid) || has(this.size) || has(this.atime) || has(this.mtime) || this.atime_now || this.mtime_now"
  };

  // 待修改属性的目标 Inode 编号。
  uint64 ino = 1 [
    (buf.validate.field).uint64.gt = 0,
    (buf.validate.field).uint64.lte = 9223372036854775807
  ];

  // 待修改的文件模式与权限位（不超过 0o177777）。
  optional uint32 mode = 2 [(buf.validate.field).uint32.lte = 65535];

  // 待修改的属主用户 ID。
  optional uint32 uid = 3;

  // 待修改的属组 ID。
  optional uint32 gid = 4;

  // 待修改的文件物理大小（字节数）。
  optional uint64 size = 5 [(buf.validate.field).uint64.lte = 9223372036854775807];

  // 待修改的最后访问时间。
  optional google.protobuf.Timestamp atime = 6;

  // 待修改的最后修改时间。
  optional google.protobuf.Timestamp mtime = 7;

  // 是否将最后访问时间设置为当前服务端时间。与 atime 互斥。
  bool atime_now = 8;

  // 是否将最后修改时间设置为当前服务端时间。与 mtime 互斥。
  bool mtime_now = 9;
}

// SetAttrResponse 包含更新后的 Inode 实体元数据及内核属性缓存时长。
message SetAttrResponse {
  // 更新后的目标 Inode 实体元数据。
  Inode inode = 1 [(buf.validate.field).required = true];

  // 属性 (attr) 在 FUSE 内核中的有效缓存时长（秒）。
  double attr_timeout_seconds = 2 [(buf.validate.field).double.gte = 0];
}

// Inode 代表文件系统中的实体节点。
message Inode {
  // 节点的全局唯一持久化标识。
  uint64 ino = 1 [(buf.validate.field).uint64.gt = 0];

  // Inode 代数版本，用于标识 Inode 复用生命周期，防止陈旧引用。
  uint64 generation = 2;

  // 节点的 POSIX 物理属性集合。
  InodeAttribute attr = 3 [(buf.validate.field).required = true];
}

// InodeAttribute 包含遵循 POSIX 规范的节点物理属性。
message InodeAttribute {
  // 文件的模式位（包含文件类型 S_IFREG, S_IFDIR 及权限位 0755, 0644 等）。
  uint32 mode = 1 [(buf.validate.field).uint32.gt = 0];

  // 文件物理大小（字节数）。
  uint64 size = 2;

  // 硬链接数量。文件默认为 1；目录通常至少为 2。
  uint32 nlink = 3 [(buf.validate.field).uint32.gt = 0];

  // 所属用户 ID。
  uint32 uid = 4;

  // 所属组 ID。
  uint32 gid = 5;

  // 特殊设备号（仅当为设备文件时有效，常规文件为 0）。
  uint32 rdev = 6;

  // 块大小（字节数，例如 4096）。
  uint32 blksize = 7;

  // 占用的 512 字节块数量。
  uint64 blocks = 8;

  // 最后访问时间。
  google.protobuf.Timestamp atime = 9;

  // 最后修改时间。
  google.protobuf.Timestamp mtime = 10;

  // 状态变更时间。
  google.protobuf.Timestamp ctime = 11;
}
