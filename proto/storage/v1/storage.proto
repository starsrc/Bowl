syntax = "proto3";

package storage.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/starsrc/bowl/gen/go/storage/v1;storagev1";

// StorageService 提供针对分布式文件系统的元数据操作与 FUSE 协议对接能力。
service StorageService {
  // Lookup 执行单级目录项查找。
  // 根据父目录 Inode 与目标子项名称获取对应的 Inode 元数据及内核缓存时效。
  // 若父节点或目标子项不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若父节点存在但非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  rpc Lookup(LookupRequest) returns (LookupResponse);

  // GetAttr 获取指定 Inode 的属性与内核缓存时效。
  // 遵循 Linux FUSE FUSE_GETATTR 规范，支持已解链但仍打开的孤儿节点 (nlink == 0)。
  // 若指定 Inode 不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  rpc GetAttr(GetAttrRequest) returns (GetAttrResponse);

  // SetAttr 修改指定 Inode 的元数据属性（对接 Linux FUSE FUSE_SETATTR 协议）。
  // 遵循按需部分更新语义。若节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)；
  // 若违反 POSIX 语义（如对目录设置大小），必须返回 gRPC 标准状态码 InvalidArgument 或相应错误。
  rpc SetAttr(SetAttrRequest) returns (SetAttrResponse);

  // Mknod 在指定父目录下创建常规文件或特殊设备节点。
  // 若同名文件或目录项已存在，必须返回 gRPC 标准状态码 AlreadyExists (映射至 POSIX EEXIST)。
  // 若父节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若父节点存在但非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  rpc Mknod(MknodRequest) returns (MknodResponse);

  // Mkdir 在指定父目录下创建子目录。
  // 若同名文件或目录项已存在，必须返回 gRPC 标准状态码 AlreadyExists (映射至 POSIX EEXIST)。
  // 若父节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若父节点存在但非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);

  // Symlink 在指定父目录下创建指向目标路径的符号链接节点。
  // 若同名文件或目录项已存在，必须返回 gRPC 标准状态码 AlreadyExists (映射至 POSIX EEXIST)。
  // 若父节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若父节点存在但非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  rpc Symlink(SymlinkRequest) returns (SymlinkResponse);

  // Readlink 获取符号链接节点指向的目标路径。
  // 若节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若节点存在但非符号链接类型，必须返回 gRPC 标准状态码 InvalidArgument (映射至 POSIX EINVAL)。
  rpc Readlink(ReadlinkRequest) returns (ReadlinkResponse);

  // Link 为已有非目录 Inode 在目标父目录下创建硬链接。
  // 若同名文件或目录项已存在，必须返回 gRPC 标准状态码 AlreadyExists (映射至 POSIX EEXIST)。
  // 若父节点不存在或源节点不存在/已解链，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若父节点非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  // 若源节点为目录，必须返回 gRPC 标准状态码 PermissionDenied (映射至 POSIX EPERM)。
  rpc Link(LinkRequest) returns (LinkResponse);

  // Unlink 删除指定父目录下的非目录项（解链）。
  // 若目标节点为目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX EISDIR)。
  // 若父节点不存在或目标目录项不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若父节点存在但非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  // 对 "." 或 ".."，必须返回 gRPC 标准状态码 InvalidArgument (映射至 POSIX EINVAL)。
  rpc Unlink(UnlinkRequest) returns (UnlinkResponse);

  // Rmdir 移除指定父目录下的空目录项。
  // 若目标节点非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  // 若目标目录非空，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTEMPTY)。
  // 若父节点不存在或目标目录项不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若父节点存在但非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  // 对 "." 返回 InvalidArgument (EINVAL)；对 ".." 返回 FailedPrecondition (ENOTEMPTY)。
  rpc Rmdir(RmdirRequest) returns (RmdirResponse);

  // Rename 执行原子文件/目录重命名或移动（支持覆盖已存在的目标项）。
  // 若源与目标为同一路径或同一 Inode 的硬链接，执行 POSIX 规范要求的无副作用短路成功返回。
  // 若源项或父目录不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若父目录存在但非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  // 若源为目录而目标为非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  // 若源为非目录而目标为目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX EISDIR)。
  // 若源为目录而目标为非空目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTEMPTY)。
  // 若尝试将目录移动为其自身或子孙目录，必须返回 gRPC 标准状态码 InvalidArgument (映射至 POSIX EINVAL)。
  // 对 "." 或 ".." 的重命名，必须返回 gRPC 标准状态码 InvalidArgument (映射至 POSIX EINVAL)。
  rpc Rename(RenameRequest) returns (RenameResponse);

  // Create 在指定父目录下原子创建常规文件并分配初始文件句柄 (FileHandle)。
  // 若同名文件或目录项已存在，必须返回 gRPC 标准状态码 AlreadyExists (映射至 POSIX EEXIST)。
  // 若父节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若父节点存在但非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  // 仅允许创建常规文件 (mode & S_IFMT 必须为 0 或 S_IFREG)。
  rpc Create(CreateRequest) returns (CreateResponse);

  // Open 打开指定 Inode 节点并分配文件句柄 (FileHandle)。
  // 若目标为目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX EISDIR)。
  // 若目标为符号链接，必须返回 gRPC 标准状态码 InvalidArgument (映射至 POSIX EINVAL)。
  // 若节点不存在或为已无活跃句柄的孤儿节点 (nlink == 0)，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若携带 O_TRUNC 但以只读模式打开，必须返回 gRPC 标准状态码 InvalidArgument (映射至 POSIX EINVAL)。
  rpc Open(OpenRequest) returns (OpenResponse);

  // Flush 在单次文件关闭时触发，冲刷并校验文件句柄的合法性（不销毁文件句柄）。
  // 若节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若文件句柄不存在或与 Inode 不匹配，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX EBADF)。
  rpc Flush(FlushRequest) returns (FlushResponse);

  // Fsync 同步并持久化文件节点与句柄关联的状态。
  // 若节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若文件句柄不存在或与 Inode 不匹配，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX EBADF)。
  rpc Fsync(FsyncRequest) returns (FsyncResponse);

  // Release 关闭并销毁文件句柄 (FileHandle)。
  // 若节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若文件句柄不存在或与 Inode 不匹配，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX EBADF)。
  // 当目标 Inode 的硬链接数已为 0 (孤儿节点) 且所有活跃句柄均已销毁时，将触发底层物理回收。
  rpc Release(ReleaseRequest) returns (ReleaseResponse);

  // OpenDir 打开指定目录 Inode 节点并分配目录句柄 (DirHandle)。
  // 若目标非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  // 若节点不存在或为已无活跃句柄的孤儿目录 (nlink == 0)，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若打开标志位非只读 (flags & O_ACCMODE != O_RDONLY) 或携带 O_TRUNC，必须返回 gRPC 标准状态码 InvalidArgument (映射至 POSIX EINVAL)。
  rpc OpenDir(OpenDirRequest) returns (OpenDirResponse);

  // ReleaseDir 关闭并销毁目录句柄 (DirHandle)。
  // 若目标非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  // 若节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若目录句柄不存在或与 Inode 不匹配，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX EBADF)。
  // 当目标目录的硬链接数已为 0 (孤儿目录) 且所有活跃句柄均已销毁时，将触发底层物理回收。
  rpc ReleaseDir(ReleaseDirRequest) returns (ReleaseDirResponse);

  // ReadDir 读取指定目录的子项流（基本条目）。
  // 若目标非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  // 若节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若目录句柄不存在或与 Inode 不匹配，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX EBADF)。
  // 处于 rmdir-whilst-open 状态的孤儿目录直接返回空列表。
  rpc ReadDir(ReadDirRequest) returns (ReadDirResponse);

  // ReadDirPlus 读取指定目录的子项流并附带完整 Inode 属性与缓存时效（扩展条目）。
  // 若目标非目录，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX ENOTDIR)。
  // 若节点不存在，必须返回 gRPC 标准状态码 NotFound (映射至 POSIX ENOENT)。
  // 若目录句柄不存在或与 Inode 不匹配，必须返回 gRPC 标准状态码 FailedPrecondition (映射至 POSIX EBADF)。
  // 处于 rmdir-whilst-open 状态的孤儿目录直接返回空列表。
  rpc ReadDirPlus(ReadDirPlusRequest) returns (ReadDirPlusResponse);

  // Fallocate 为常规文件预分配物理空间或打洞去分配空间（对接 Linux FUSE FUSE_FALLOCATE 协议）。
  // 遵循 Linux fallocate(2) 语义，支持空间预分配、保留大小分配及打洞释放空间。
  rpc Fallocate(FallocateRequest) returns (FallocateResponse);
}

// LookupRequest 定义 Lookup 接口输入参数。
message LookupRequest {
  // 父目录的 Inode 编号。根目录通常为 1。
  uint64 parent_ino = 1 [(buf.validate.field).uint64.gt = 0];

  // 待查找的子项名称（文件或目录名）。
  // 长度必须在 1 到 255 字节之间，且严禁包含路径分隔符 '/' 与空字节 '\x00'。
  bytes name = 2 [
    (buf.validate.field).bytes.min_len = 1,
    (buf.validate.field).bytes.max_len = 255,
    (buf.validate.field).cel = {
      id: "bytes_name_no_slash_or_nul"
      message: "name cannot contain '/' or NUL byte"
      expression: "!this.contains(b'\\x00') && !this.contains(b'/')"
    }
  ];
}

// LookupResponse 包含查找命中的节点元数据以及 FUSE 内核缓存有效时间。
message LookupResponse {
  // 命中的目标 Inode 实体元数据。
  Inode inode = 1 [(buf.validate.field).required = true];

  // 目录项 (dentry) 在 FUSE 内核中的有效缓存时长（秒）。
  double entry_timeout_seconds = 2 [(buf.validate.field).double.gte = 0];

  // 属性 (attr) 在 FUSE 内核中的有效缓存时长（秒）。
  double attr_timeout_seconds = 3 [(buf.validate.field).double.gte = 0];
}

// GetAttrRequest 定义 GetAttr 接口输入参数。
message GetAttrRequest {
  // 目标节点的 Inode 编号。
  // 必须大于 0 且小于等于 int64 最大值 (9223372036854775807)，防止向数据库 BIGINT 转换时发生整型溢出。
  uint64 ino = 1 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
}

// GetAttrResponse 包含目标节点元数据以及 FUSE 属性缓存有效时间。
message GetAttrResponse {
  // 目标 Inode 实体元数据。
  Inode inode = 1 [(buf.validate.field).required = true];

  // 属性 (attr) 在 FUSE 内核中的有效缓存时长（秒）。
  double attr_timeout_seconds = 2 [(buf.validate.field).double.gte = 0];
}

// SetAttrRequest 定义 SetAttr 接口输入参数。
// 遵循按需部分更新语义，未显式设置的属性保持原值不变。
message SetAttrRequest {
  option (buf.validate.message).cel = {
    id: "setattr_atime_conflict"
    message: "atime and atime_now cannot both be set"
    expression: "!(has(this.atime) && this.atime_now)"
  };
  option (buf.validate.message).cel = {
    id: "setattr_mtime_conflict"
    message: "mtime and mtime_now cannot both be set"
    expression: "!(has(this.mtime) && this.mtime_now)"
  };
  option (buf.validate.message).cel = {
    id: "setattr_has_update"
    message: "at least one attribute must be updated"
    expression: "has(this.mode) || has(this.uid) || has(this.gid) || has(this.size) || has(this.atime) || has(this.mtime) || this.atime_now || this.mtime_now"
  };

  // 待修改属性的目标 Inode 编号。
  uint64 ino = 1 [
    (buf.validate.field).uint64.gt = 0,
    (buf.validate.field).uint64.lte = 9223372036854775807
  ];

  // 待修改的文件模式与权限位（不超过 0o177777）。
  optional uint32 mode = 2 [(buf.validate.field).uint32.lte = 65535];

  // 待修改的属主用户 ID。
  optional uint32 uid = 3 [(buf.validate.field).uint32.lte = 2147483647];

  // 待修改的属组 ID。
  optional uint32 gid = 4 [(buf.validate.field).uint32.lte = 2147483647];

  // 待修改的文件物理大小（字节数）。
  optional uint64 size = 5 [(buf.validate.field).uint64.lte = 9223372036854775807];

  // 待修改的最后访问时间。
  optional google.protobuf.Timestamp atime = 6;

  // 待修改的最后修改时间。
  optional google.protobuf.Timestamp mtime = 7;

  // 是否将最后访问时间设置为当前服务端时间。与 atime 互斥。
  bool atime_now = 8;

  // 是否将最后修改时间设置为当前服务端时间。与 mtime 互斥。
  bool mtime_now = 9;
}

// SetAttrResponse 包含更新后的 Inode 实体元数据及内核属性缓存时长。
message SetAttrResponse {
  // 更新后的目标 Inode 实体元数据。
  Inode inode = 1 [(buf.validate.field).required = true];

  // 属性 (attr) 在 FUSE 内核中的有效缓存时长（秒）。
  double attr_timeout_seconds = 2 [(buf.validate.field).double.gte = 0];
}

// MknodRequest 定义 Mknod 接口输入参数。
message MknodRequest {
  // 父目录的 Inode 编号。必须大于 0 且在 int64 正数范围内 (<= 9223372036854775807)。
  uint64 parent_ino = 1 [
    (buf.validate.field).uint64.gt = 0,
    (buf.validate.field).uint64.lte = 9223372036854775807
  ];

  // 待创建的新节点名称。
  // 长度必须在 1 到 255 字节之间，且严禁包含路径分隔符 '/' 与空字节 '\x00'。
  bytes name = 2 [
    (buf.validate.field).bytes.min_len = 1,
    (buf.validate.field).bytes.max_len = 255,
    (buf.validate.field).cel = {
      id: "bytes_name_no_slash_or_nul"
      message: "name cannot contain '/' or NUL byte"
      expression: "!this.contains(b'\\x00') && !this.contains(b'/')"
    }
  ];

  // 节点模式位（包含文件类型及权限位，取值范围必须在 1 到 0o177777 / 65535 之间）。
  uint32 mode = 3 [
    (buf.validate.field).uint32.gt = 0,
    (buf.validate.field).uint32.lte = 65535
  ];

  // 所属用户 ID。
  uint32 uid = 4;

  // 所属组 ID。
  uint32 gid = 5;

  // 特殊设备号（仅当创建字符/块设备文件时有效，其余节点为 0）。
  uint32 rdev = 6;
}

// MknodResponse 包含新创建节点的元数据以及 FUSE 内核缓存有效时间。
message MknodResponse {
  // 新创建的 Inode 实体元数据。
  Inode inode = 1 [(buf.validate.field).required = true];

  // 目录项 (dentry) 在 FUSE 内核中的有效缓存时长（秒）。
  double entry_timeout_seconds = 2 [(buf.validate.field).double.gte = 0];

  // 属性 (attr) 在 FUSE 内核中的有效缓存时长（秒）。
  double attr_timeout_seconds = 3 [(buf.validate.field).double.gte = 0];
}

// MkdirRequest 定义 Mkdir 接口输入参数。
message MkdirRequest {
  // 父目录的 Inode 编号。必须大于 0 且在 int64 正数范围内 (<= 9223372036854775807)。
  uint64 parent_ino = 1 [
    (buf.validate.field).uint64.gt = 0,
    (buf.validate.field).uint64.lte = 9223372036854775807
  ];

  // 待创建的新目录名称。
  // 长度必须在 1 到 255 字节之间，且严禁包含路径分隔符 '/' 与空字节 '\x00'。
  bytes name = 2 [
    (buf.validate.field).bytes.min_len = 1,
    (buf.validate.field).bytes.max_len = 255,
    (buf.validate.field).cel = {
      id: "bytes_name_no_slash_or_nul"
      message: "name cannot contain '/' or NUL byte"
      expression: "!this.contains(b'\\x00') && !this.contains(b'/')"
    }
  ];

  // 目录模式位（包含可选的 S_IFDIR 文件类型位及权限位，取值范围必须在 0 到 0o177777 / 65535 之间）。
  uint32 mode = 3 [(buf.validate.field).uint32.lte = 65535];

  // 所属用户 ID。
  uint32 uid = 4;

  // 所属组 ID。
  uint32 gid = 5;
}

// MkdirResponse 包含新创建目录的元数据以及 FUSE 内核缓存有效时间。
message MkdirResponse {
  // 新创建的 Inode 实体元数据。
  Inode inode = 1 [(buf.validate.field).required = true];

  // 目录项 (dentry) 在 FUSE 内核中的有效缓存时长（秒）。
  double entry_timeout_seconds = 2 [(buf.validate.field).double.gte = 0];

  // 属性 (attr) 在 FUSE 内核中的有效缓存时长（秒）。
  double attr_timeout_seconds = 3 [(buf.validate.field).double.gte = 0];
}

// SymlinkRequest 定义 Symlink 接口输入参数。
message SymlinkRequest {
  // 父目录的 Inode 编号。必须大于 0 且在 int64 正数范围内 (<= 9223372036854775807)。
  uint64 parent_ino = 1 [
    (buf.validate.field).uint64.gt = 0,
    (buf.validate.field).uint64.lte = 9223372036854775807
  ];

  // 待创建的符号链接名称。
  // 长度必须在 1 到 255 字节之间，且严禁包含路径分隔符 '/' 与空字节 '\x00'。
  bytes name = 2 [
    (buf.validate.field).bytes.min_len = 1,
