    (buf.validate.field).bytes.min_len = 1,
    (buf.validate.field).bytes.max_len = 255,
    (buf.validate.field).cel = {
      id: "bytes_name_no_slash_or_nul"
      message: "name cannot contain '/' or NUL byte"
      expression: "!this.contains(b'\\x00') && !this.contains(b'/')"
    }
