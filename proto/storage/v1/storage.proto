    id: "setattr_has_update"
    message: "at least one attribute must be updated"
    expression: "has(this.mode) || has(this.uid) || has(this.gid) || has(this.size) || has(this.atime) || has(this.mtime) || this.atime_now || this.mtime_now || this.ctime_now || has(this.flags)"
  };

